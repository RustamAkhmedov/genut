[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genut"
version = "0.1.0"
description = "Aus Fotos von Heftseiten werden interaktive Lernseiten"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "sympy>=1.12",
  "numpy>=1.26",
  "pillow>=10",
  "pillow-heif>=0.16",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "mammoth>=1.8",
  "python-pptx>=1.0",
  "pypdfium2>=4.30",
  "beautifulsoup4>=4.12",
  "markdownify>=1.1",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright>=1.44", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["genut*"]

[tool.setuptools.package-data]
genut = ["prompts/*.md", "render/templates/**/*", "render/assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
